<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSI-Learning 片头</title>
<!--
  HSI-Learning video intro (v2) — ends on the exact cover layout of the classroom decks
  built by scripts/build_course_slides.js: midnight background, spectral bars of the real
  Indian Pines mean spectrum along the bottom, short title, "本课问题", hero figure card.

  Every visual property is a pure function of time t (renderFrame(t)), so the build script
  can step frames deterministically. Opened directly in a browser it plays in real time;
  click to replay.

  URL params:  ?lesson=L01   lesson variant      (none) series variant
               &capture=1    no autoplay / scaling (used by the build)
               &t=3.2        freeze at a given time (design review)
-->
<script src="intro-data.js"></script>
<style>
  :root {
    /* scripts/build_course_slides.js tokens */
    --midnight: #0D1B2E;
    --blue: #2F5BB7;
    --mist: #A9BACD;
    --amber: #F5B54A;
    --cjk: "Microsoft YaHei", "微软雅黑", "PingFang SC", "Noto Sans SC", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
    --mono: Consolas, "SFMono-Regular", Menlo, "DejaVu Sans Mono", monospace;
  }
  html, body { margin: 0; height: 100%; background: #05080D; overflow: hidden; }
  body.capture { background: var(--midnight); }
  /* 1920x1080 stage = 13.333 x 7.5 in slide: 1 in = 144 px, 1 pt = 2 px. */
  #stage {
    position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
    background: var(--midnight); overflow: hidden; transform-origin: 0 0;
    font-family: var(--cjk); color: #fff;
    -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
  }
  .abs { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
  .bar { position: absolute; left: 0; top: 0; width: 1px; height: 1px; transform-origin: 0 0; }
  #glow { left: 0; top: 0; width: 1920px; height: 1080px;
          background: radial-gradient(ellipse 900px 420px at 960px 520px, rgba(47, 91, 183, 0.22), rgba(13, 27, 46, 0) 70%); }
  #curve { width: 1920px; height: 1080px; overflow: visible; }
  #head { width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #fff;
          box-shadow: 0 0 18px 6px rgba(245, 181, 74, 0.55); }
  #caption { font-family: var(--mono); font-size: 19px; color: var(--mist); letter-spacing: 0.06em; white-space: nowrap; }
  #brand { left: 0; top: 857px; width: 1920px; height: 223px; opacity: 0; }
  /* cover layout (deck cover(), inches x 144) */
  #mark { left: 108px; top: 89px; font-size: 24px; font-weight: 700; color: var(--mist); white-space: nowrap;
          letter-spacing: 6px; line-height: 1.32; transform-origin: 0 0; }
  #pill { left: 108px; top: 194px; width: 124px; height: 55px; border-radius: 9px; background: var(--blue);
          font-size: 30px; font-weight: 700; display: flex; align-items: center; justify-content: center; transform-origin: 0 50%; }
  #title { left: 108px; top: 288px; width: 994px; font-size: 100px; font-weight: 700; line-height: 1.30; white-space: pre-line; }
  #title .line { display: block; }
  #question { left: 108px; top: 585px; width: 1008px; font-size: 38px; line-height: 1.32; white-space: nowrap; }
  #question b { color: var(--amber); font-weight: 700; margin-right: 0.5em; }
  #subtitle { left: 108px; top: 659px; width: 1008px; font-size: 32px; color: var(--mist); line-height: 1.32; white-space: nowrap; }
  #prereq { left: 108px; top: 728px; width: 1008px; font-size: 26px; color: var(--mist); line-height: 1.32; white-space: nowrap; }
  #card { background: #fff; border-radius: 14px; box-shadow: 0 8px 26px rgba(0, 0, 0, 0.45); transform-origin: 50% 50%; }
  #figure { position: absolute; }
</style>
</head>
<body>
<div id="stage">
  <div id="glow" class="abs"></div>
  <img id="brand" class="abs" src="../../slides/assets/brand/spectrum-bars.png" alt="">
  <div id="bars"></div>
  <svg id="curve" class="abs" viewBox="0 0 1920 1080">
    <defs><linearGradient id="spec" gradientUnits="userSpaceOnUse" x1="360" y1="0" x2="1560" y2="0"></linearGradient></defs>
    <g id="curveG"><path id="curvePath" d="" fill="none" stroke="url(#spec)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" pathLength="1" vector-effect="non-scaling-stroke"></path></g>
  </svg>
  <div id="head" class="abs"></div>
  <div id="caption" class="abs"></div>
  <div id="mark" class="abs">HSI-LEARNING  ·  高光谱图像分类课程</div>
  <div id="pill" class="abs"></div>
  <div id="title" class="abs"></div>
  <div id="question" class="abs"><b></b><span></span></div>
  <div id="subtitle" class="abs"></div>
  <div id="prereq" class="abs"></div>
  <div id="card" class="abs"><img id="figure" alt=""></div>
</div>
<script>
(() => {
  const DATA = window.INTRO_DATA;
  const params = new URLSearchParams(location.search);
  const CAPTURE = params.has('capture');
  const DURATION = 6.5;
  const STOPS = ['472A8A', '2C5FB0', '1F8FB8', '2E9E4F', 'F2C316', 'E8752A', 'D33A2C'];
  const IN = 144;  // px per slide inch

  // ---------------------------------------------------------- content
  const id = (params.get('lesson') || '').toUpperCase();
  const card = DATA.lessons[id] || DATA.series;
  const $ = (s) => document.getElementById(s);
  $('pill').textContent = card.id;
  card.cover_title.split('\n').forEach((t) => { const d = document.createElement('span'); d.className = 'line'; d.textContent = t; $('title').appendChild(d); });
  $('question').querySelector('b').textContent = card.question_label;
  $('question').querySelector('span').textContent = card.question;
  $('subtitle').textContent = card.subtitle;
  $('prereq').textContent = card.footer;
  $('caption').textContent = DATA.caption;
  const H = card.hero;
  const cardEl = $('card'), fig = $('figure');
  Object.assign(cardEl.style, { left: H.card.x * IN + 'px', top: H.card.y * IN + 'px', width: H.card.w * IN + 'px', height: H.card.h * IN + 'px' });
  Object.assign(fig.style, { left: (H.figure.x - H.card.x) * IN + 'px', top: (H.figure.y - H.card.y) * IN + 'px', width: H.figure.w * IN + 'px', height: H.figure.h * IN + 'px' });
  fig.src = H.src;

  // ---------------------------------------------------------- helpers
  const clamp = (v) => Math.max(0, Math.min(1, v));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const lerp = (a, b, k) => a + (b - a) * k;
  const outCubic = (k) => 1 - Math.pow(1 - k, 3);
  const outQuint = (k) => 1 - Math.pow(1 - k, 5);
  const outBack = (k) => 1 + 2.2 * Math.pow(k - 1, 3) + 1.2 * Math.pow(k - 1, 2);
  const inOutCubic = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
  const hex = (h) => [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16));
  const spectral = (u) => {
    const x = clamp(u) * (STOPS.length - 1), i = Math.min(Math.floor(x), STOPS.length - 2), f = x - i;
    const a = hex(STOPS[i]), b = hex(STOPS[i + 1]);
    return `rgb(${a.map((v, j) => Math.round(lerp(v, b[j], f))).join(',')})`;
  };
  const tf = (el, x, y, s = 1) => { el.style.transform = `translate(${x}px, ${y}px) scale(${s})`; };
  const show = (el, o) => { el.style.opacity = o; el.style.visibility = o <= 0.001 ? 'hidden' : 'visible'; };
  const rise = (el, t, a, b, dy = 26) => { const k = outCubic(seg(t, a, b)); show(el, k); tf(el, 0, (1 - k) * dy); };

  // ---------------------------------------------------------- geometry
  const N = DATA.spectrum.length;
  // stage 1: centred spectrum
  const X0 = 360, X1 = 1560, BASE = 610, AMP = 270, PITCH = (X1 - X0) / (N - 1);
  const xs = DATA.spectrum.map((_, i) => X0 + i * PITCH);
  const ys = DATA.spectrum.map((v) => BASE - 22 - v * (AMP - 22));
  // stage 2: the cover's bottom band (make_slide_brand_assets.py geometry, scaled to 1920 x 223)
  const BT = 857, BH = 223, BP = 1920 / N;
  const bx = (i) => i * BP + BP * 0.18, bw = BP * 0.42;
  const btop = (v) => BT + BH - (0.14 + 0.82 * v) * BH;

  $('curvePath').setAttribute('d', xs.map((x, i) => `${i ? 'L' : 'M'}${x.toFixed(2)},${ys[i].toFixed(2)}`).join(''));
  STOPS.forEach((c, i) => {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
    s.setAttribute('offset', i / (STOPS.length - 1)); s.setAttribute('stop-color', '#' + c); $('spec').appendChild(s);
  });
  const bars = DATA.spectrum.map((_, i) => {
    const d = document.createElement('div'); d.className = 'bar'; d.style.background = spectral(i / (N - 1));
    $('bars').appendChild(d); return d;
  });
  // The curve maps affinely: x -> (x - X0) * sx + 0.39 BP, y -> y * sy + ty.
  const SX = BP / PITCH, SY = (0.82 * BH) / (AMP - 22);
  const TY = btop(0) - (BASE - 22) * SY;

  // ---------------------------------------------------------- timeline
  const FOLD = 2.8, FOLD_D = 1.0, C0 = 3.45;
  function renderFrame(t) {
    show($('glow'), outCubic(seg(t, 0, 1.2)) * (1 - 0.6 * seg(t, FOLD, FOLD + FOLD_D)));

    // 1 · bands rise while the mean spectrum draws itself (0.25 – 1.45 s)
    // 2 · the whole spectrum settles into the cover's bottom band (2.8 – 3.8 s)
    const k = inOutCubic(seg(t, FOLD, FOLD + FOLD_D));
    bars.forEach((el, i) => {
      const u = i / (N - 1);
      const grow = outCubic(seg(t, 0.25 + 0.95 * u, 0.25 + 0.95 * u + 0.4));
      const top0 = BASE - (BASE - ys[i]) * grow;
      const x = lerp(xs[i] - 1.4, bx(i), k), w = lerp(2.8, bw, k);
      const top = lerp(top0, btop(DATA.spectrum[i]), k), bottom = lerp(BASE, BT + BH, k);
      el.style.transform = `translate(${x}px, ${top}px) scale(${w}, ${Math.max(bottom - top, 0.01)})`;
      el.style.opacity = grow <= 0 ? 0 : lerp(0.55, 0.5, k);
    });
    const draw = inOutCubic(seg(t, 0.25, 1.45));
    const path = $('curvePath');
    // dashes are measured in screen space under non-scaling-stroke: drop them once drawn
    path.style.strokeDasharray = draw >= 1 ? 'none' : '1 1';
    path.style.strokeDashoffset = 1 - draw;
    path.setAttribute('stroke-width', lerp(4, 2.9, k));  // brand PNG line: 4 px at 2667 wide
    const curve = $('curve');
    $('curveG').setAttribute('transform', `matrix(${lerp(1, SX, k)} 0 0 ${lerp(1, SY, k)} ${lerp(0, 0.39 * BP - X0 * SX, k)} ${lerp(0, TY, k)})`);
    // hand over to the exact cover artwork once the move is done
    const swap = seg(t, FOLD + FOLD_D - 0.05, FOLD + FOLD_D + 0.25);
    show($('bars'), draw > 0 ? 1 - swap : 0);
    show(curve, draw > 0 ? 1 - swap : 0);
    show($('brand'), swap * 0.85);

    const fi = draw * (N - 1), i0 = Math.min(Math.floor(fi), N - 2), f = fi - i0;
    tf($('head'), lerp(xs[i0], xs[i0 + 1], f), lerp(ys[i0], ys[i0 + 1], f));
    show($('head'), Math.min(seg(t, 0.25, 0.4), 1 - seg(t, 1.45, 1.75)));

    const cap = $('caption');
    const capK = outCubic(seg(t, 1.25, 1.85)) * (1 - seg(t, FOLD - 0.1, FOLD + 0.25));
    show(cap, capK); tf(cap, X0, BASE + 26 + (1 - outCubic(seg(t, 1.25, 1.85))) * 12);

    // wordmark: centred under the spectrum, then into the cover kicker slot
    const mark = $('mark'), mw = mark.offsetWidth, mh = mark.offsetHeight;
    const S = 1.75, cx = 960, cy = BASE + 175;
    const inK = outCubic(seg(t, 1.35, 2.15)), mv = inOutCubic(seg(t, FOLD + 0.05, FOLD + 0.95));
    show(mark, inK);
    tf(mark, lerp(cx - (S * mw) / 2 - 108, 0, mv), lerp(cy - (S * mh) / 2 - 89 + (1 - inK) * 18, 0, mv), lerp(S, 1, mv));
    mark.style.color = `rgb(${hex('FFFFFF').map((v, j) => Math.round(lerp(v, hex('A9BACD')[j], mv))).join(',')})`;

    // 3 · the cover builds in (deck cover(): pill, title, question, subtitle, prereq, hero card)
    const pk = seg(t, C0, C0 + 0.55);
    show($('pill'), Math.min(1, pk * 2.5));
    $('pill').style.transform = `scale(${pk > 0 ? lerp(0.6, 1, outBack(pk)) : 0.6})`;
    const title = $('title');
    show(title, t >= C0 + 0.1 ? 1 : 0);
    title.querySelectorAll('.line').forEach((line, i) => {
      const lk = outQuint(seg(t, C0 + 0.1 + i * 0.14, C0 + 0.95 + i * 0.14));
      const lift = (1 - lk) * line.offsetHeight;
      line.style.clipPath = `inset(0 0 ${lift}px 0)`;
      line.style.transform = `translateY(${lift}px)`;
    });
    rise($('question'), t, C0 + 0.55, C0 + 1.15, 20);
    rise($('subtitle'), t, C0 + 0.7, C0 + 1.3, 16);
    rise($('prereq'), t, C0 + 0.82, C0 + 1.42, 16);
    const ck = outCubic(seg(t, C0 + 0.25, C0 + 1.15));
    show(cardEl, ck);
    cardEl.style.transform = `translate(${(1 - ck) * 60}px, 0) scale(${lerp(0.96, 1, ck)})`;
  }

  window.INTRO = { renderFrame, DURATION, id: card.id };

  // ---------------------------------------------------------- playback
  const stage = $('stage');
  if (CAPTURE) { document.body.classList.add('capture'); renderFrame(0); return; }
  const fit = () => {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `translate(${(innerWidth - 1920 * s) / 2}px, ${(innerHeight - 1080 * s) / 2}px) scale(${s})`;
  };
  addEventListener('resize', fit); fit();
  if (params.has('t')) { document.fonts.ready.then(() => renderFrame(parseFloat(params.get('t')))); return; }
  let start = null, running = false;
  const loop = (now) => {
    if (start === null) start = now;
    const t = (now - start) / 1000;
    renderFrame(Math.min(t, DURATION));
    running = t < DURATION;
    if (running) requestAnimationFrame(loop);
  };
  const play = () => { start = null; if (!running) { running = true; requestAnimationFrame(loop); } };
  document.fonts.ready.then(play);
  addEventListener('click', play);
})();
</script>
</body>
</html>
